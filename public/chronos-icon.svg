<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#121214" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997D20"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#121214"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="#18181c" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Radial Glow behind clock -->
  <circle cx="256" cy="256" r="220" fill="url(#goldGlow)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="#141417" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Hour tick marks -->
  <g stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="256" y1="96" x2="256" y2="116"/>
    <line x1="256" y1="396" x2="256" y2="416"/>
    <line x1="96" y1="256" x2="116" y2="256"/>
    <line x1="396" y1="256" x2="416" y2="256"/>
  </g>

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="6 6"/>

  <!-- Clock Hands -->
  <!-- Hour Hand pointing to 10 o'clock -->
  <line x1="256" y1="256" x2="180" y2="170" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Minute Hand pointing to 2 o'clock -->
  <line x1="256" y1="256" x2="330" y2="140" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#F3E5AB" stroke="#121214" stroke-width="4"/>
  <circle cx="256" cy="256" r="5" fill="#D4AF37"/>
</svg>
